services:
  quantlab:
    build: .
    ports:
      - "8000:8000"
    environment:
      QUANTLAB_DB: /data/quantlab.sqlite3
    volumes:
      - quantlab_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 20s
      timeout: 5s
      retries: 3
    restart: unless-stopped
volumes:
  quantlab_data:
